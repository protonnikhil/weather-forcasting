<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WeatherOS Ultra - Flagship Weather Forecasting</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14;--card:rgba(22,31,48,0.7);--card2:rgba(28,39,64,0.8);--line:rgba(255,255,255,0.08);--txt:#eef2ff;--mut:#8b98b3;--acc:#5b8cff;--acc2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--rad:20px;--shadow:0 12px 40px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(800px at 20% -10%, rgba(91,140,255,.25), transparent), radial-gradient(600px at 90% 10%, rgba(34,211,238,.2), transparent), radial-gradient(700px at 50% 120%, rgba(168,85,247,.15), transparent)}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(7,10,20,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5b8cff,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 20px rgba(91,140,255,.4)}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.3px}
.topbar.sub{font-size:11px;color:var(--mut)}
.spacer{flex:1}
.search-wrap{position:relative;flex:1;max-width:420px;margin-left:10px}
.search-inp{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font-size:14px;outline:none;transition:.2s;font-family:inherit}
.search-inp:focus{border-color:var(--acc);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(91,140,255,.15)}
.search-wrap::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.suggest{position:absolute;top:110%;left:0;right:0;background:rgba(17,24,39,.96);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:100;display:none;box-shadow:var(--shadow)}
.suggest.show{display:block}
.s-item{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.s-item:hover{background:rgba(255,255,255,.06)}
.s-item:last-child{border:0}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app{max-width:1180px;margin:0 auto;padding:18px 14px 30px;display:grid;gap:16px}
.hero{display:grid;grid-template-columns:1.2fr.8fr;gap:16px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.search-wrap{max-width:none}.topbar h1{display:none}}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px);position:relative;overflow:hidden}
.card h3{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.current{display:flex;flex-direction:column;justify-content:space-between;min-height:340px}
.cur-top{display:flex;justify-content:space-between;align-items:flex-start}
.cur-temp{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1}
.cur-temp span{font-size:28px;vertical-align:super;font-weight:400;opacity:.7}
.cur-desc{font-size:16px;font-weight:500;margin-top:6px;text-transform:capitalize}
.cur-loc{font-size:13px;color:var(--mut);margin-top:4px}
.cur-icon{font-size:86px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cur-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.mini{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mini.l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.mini.v{font-size:15px;font-weight:700;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.highlight{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h-item{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.h-item.ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.h-info.k{font-size:11px;color:var(--mut);text-transform:uppercase}
.h-info.val{font-size:18px;font-weight:700;margin-top:2px}
.hourly{overflow:hidden}
.hour-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hour-scroll::-webkit-scrollbar{display:none}
.hour{flex:0 0 78px;text-align:center;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.hour.active{background:linear-gradient(135deg,var(--acc),#3b6fe0);border-color:transparent;color:#fff}
.hour.t{font-size:11px;color:var(--mut)}
.hour.active.t{color:rgba(255,255,255,.8)}
.hour.ic{font-size:26px;margin:6px 0}
.hour.tmp{font-size:14px;font-weight:700}
.daily{display:flex;flex-direction:column;gap:8px}
.d-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s}
.d-row:hover{background:rgba(255,255,255,.08)}
.d-day{width:44px;font-size:13px;font-weight:600}
.d-bar{flex:1;height:6px;border-radius:10px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.d-bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,#5b8cff,#22d3ee)}
.d-temp{font-size:13px;font-weight:600;display:flex;gap:8px;min-width:70px;justify-content:flex-end}
.d-temp.mn{color:var(--mut)}
.aq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:500px){.aq{grid-template-columns:1fr 1fr}}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;display:inline-block}
.b-ok{background:rgba(52,211,153,.15);color:#34d399}
.b-warn{background:rgba(251,191,36,.15);color:#fbbf24}
.b-bad{background:rgba(248,113,113,.15);color:#f87171}
.b-info{background:rgba(91,140,255,.15);color:#5b8cff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111827;border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;z-index:200;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
canvas{width:100%!important}
.loader{text-align:center;padding:40px;color:var(--mut)}
.loader.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:20px;font-size:11px;color:var(--mut);opacity:.6}
</style>
</head>
<body>
<header class="topbar">
<div class="logo">⛅</div>
<div><h1>WeatherOS Ultra</h1><div class="sub" id="sub">Flagship Forecasting • BCA Project</div></div>
<div class="search-wrap">
<input class="search-inp" id="q" placeholder="Search city - Delhi, London, Tokyo..." autocomplete="off">
<div class="suggest" id="suggest"></div>
</div>
<button class="icon-btn" onclick="getLocation()" title="My location">📍</button>
</header>
<div class="app" id="app">
<div class="loader"><div class="spin"></div>Detecting your location...</div>
</div>
<div id="toast"></div>
<div class="footer">WeatherOS Ultra v2.0 • Built with Open-Meteo Free API • No API Key Required • BCA Final Year Project</div>
<script>
const WMAP={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Dense drizzle','🌧️'],61:['Slight rain','🌧️'],63:['Moderate rain','🌧️'],65:['Heavy rain','⛈️'],71:['Slight snow','❄️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],80:['Slight showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorm','⛈️'],96:['Thunder + hail','⛈️']};
const fmt=(n,d=0)=>Number(n).toFixed(d);
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let state={lat:28.6139,lon:77.2090,name:'New Delhi',country:'India'};

async function searchCity(q){
 if(!q||q.length<2)return;
 try{
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en&format=json`);
  const d=await r.json();
  const box=document.getElementById('suggest');
  if(!d.results){box.classList.remove('show');return;}
  box.innerHTML=d.results.map(x=>`<div class="s-item" onclick="pickCity(${x.latitude},${x.longitude},'${esc(x.name)}','${esc(x.country)}')"><div><b>${esc(x.name)}</b> <small style="color:var(--mut)">${esc(x.admin1||'')}, ${esc(x.country)}</small></div><div style="color:var(--mut)">📍</div></div>`).join('');
  box.classList.add('show');
 }catch(e){}
}
function pickCity(lat,lon,name,country){
 state={lat,lon,name,country};
 document.getElementById('suggest').classList.remove('show');
 document.getElementById('q').value=name;
 loadWeather();
}
document.getElementById('q').addEventListener('input',e=>searchCity(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('suggest').classList.remove('show')});

async function getLocation(){
 if(!navigator.geolocation){toast('Geolocation not supported');return;}
 toast('📍 Getting location...');
 navigator.geolocation.getCurrentPosition(async pos=>{
   state.lat=pos.coords.latitude; state.lon=pos.coords.longitude;
   try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${state.lat}&longitude=${state.lon}&language=en`);
    const d=await r.json();
    if(d.results&&d.results[0]){state.name=d.results[0].name; state.country=d.results[0].country;}
    else {state.name='My Location'; state.country='';}
   }catch{state.name='My Location';}
   loadWeather();
 },()=>{toast('Location denied, showing Delhi'); loadWeather();});
}

async function loadWeather(){
 const app=document.getElementById('app');
 app.innerHTML=`<div class="loader"><div class="spin"></div>Fetching ultra forecast for ${esc(state.name)}...</div>`;
 try{
  const weatherUrl=`https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,uv_index&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=7`;
  const aqUrl=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${state.lat}&longitude=${state.lon}&current=us_aqi,pm10,pm2_5&timezone=auto`;
  const [wRes,aqRes]=await Promise.all([fetch(weatherUrl), fetch(aqUrl)]);
  const w=await wRes.json();
  let aq=null; try{aq=await aqRes.json();}catch{}
  render(w,aq);
 }catch(e){app.innerHTML=`<div class="card" style="text-align:center;padding:40px">❌ Failed to load<br><small style="color:var(--mut)">${esc(e.message)}</small><br><br><button class="icon-btn" style="width:auto;padding:0 16px;margin:0 auto" onclick="loadWeather()">Retry</button></div>`;}
}

function render(w,aq){
 const cur=w.current;
 const daily=w.daily;
 const hourly=w.hourly;
 const curCode=cur.weather_code;
 const curInfo=WMAP[curCode]||['Unknown','⛅'];
 const isNight=cur.is_day===0;
 document.getElementById('sub').textContent=`${state.name}, ${state.country} • ${new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}`;
   const app=document.getElementById('app');
  // hourly data next 24
  const nowH=new Date().getHours();
  const hStart=w.hourly.time.findIndex(t=>new Date(t).getHours()===nowH) || 0;
  const hours=[];
  for(let i=hStart;i<Math.min(hStart+24,w.hourly.time.length);i++){
    const d=new Date(w.hourly.time[i]);
    hours.push({t:d.toLocaleTimeString('en-IN',{hour:'2-digit'}),temp:w.hourly.temperature_2m[i],code:w.hourly.weather_code[i],prec:w.hourly.precipitation_probability[i]});
  }
  const maxT=Math.max(...hours.map(h=>h.temp)), minT=Math.min(...hours.map(h=>h.temp));

  app.innerHTML=`
  <div class="hero">
    <div class="card current">
      <div class="cur-top">
        <div>
          <div class="cur-temp">${fmt(cur.temperature_2m)}<span>°C</span></div>
          <div class="cur-desc">${curInfo[0]} ${isNight?'• Night':''}</div>
          <div class="cur-loc">📍 ${esc(state.name)}, ${esc(state.country)} • Feels like ${fmt(cur.apparent_temperature)}°C</div>
        </div>
        <div class="cur-icon">${curInfo[1]}</div>
      </div>
      <div class="cur-stats">
        <div class="mini"><div class="l">💧 Humidity</div><div class="v">${cur.relative_humidity_2m}%</div></div>
        <div class="mini"><div class="l">💨 Wind</div><div class="v">${fmt(cur.wind_speed_10m)} km/h</div></div>
        <div class="mini"><div class="l">🌧️ Rain</div><div class="v">${cur.precipitation} mm</div></div>
      </div>
      <canvas id="tempChart" height="90" style="margin-top:16px"></canvas>
    </div>
    <div class="card">
      <h3>✨ Today's Highlights</h3>
      <div class="highlight">
        <div class="h-item"><div class="h-info"><div class="k">UV Index</div><div class="val">${fmt(cur.uv_index)} <span class="badge ${cur.uv_index>7?'b-bad':cur.uv_index>3?'b-warn':'b-ok'}" style="margin-left:6px">${cur.uv_index>7?'High':cur.uv_index>3?'Moderate':'Low'}</span></div></div><div class="ic" style="background:rgba(251,191,36,.15)">☀️</div></div>
        <div class="h-item"><div class="h-info"><div class="k">Pressure</div><div class="val">${fmt(cur.pressure_msl)} hPa</div></div><div class="ic" style="background:rgba(91,140,255,.15)">🌡️</div></div>
        <div class="h-item"><div class="h-info"><div class="k">Wind Direction</div><div class="val">${fmt(cur.wind_direction_10m)}°</div></div><div class="ic" style="background:rgba(52,211,153,.15)">🧭</div></div>
        <div class="h-item"><div class="h-info"><div class="k">Precipitation</div><div class="val">${daily.precipitation_sum[0]} mm</div></div><div class="ic" style="background:rgba(34,211,238,.15)">💧</div></div>
        <div class="h-item"><div class="h-info"><div class="k">Sunrise</div><div class="val">${new Date(daily.sunrise[0]).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="ic" style="background:rgba(248,113,113,.15)">🌅</div></div>
        <div class="h-item"><div class="h-info"><div class="k">Sunset</div><div class="val">${new Date(daily.sunset[0]).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="ic" style="background:rgba(168,85,247,.15)">🌇</div></div>
      </div>
      <div style="margin-top:16px">
        <h3>🌫️ Air Quality</h3>
        ${aq&&aq.current?`
        <div class="aq">
          <div class="mini"><div class="l">US AQI</div><div class="v">${aq.current.us_aqi} <span class="badge ${aq.current.us_aqi>150?'b-bad':aq.current.us_aqi>50?'b-warn':'b-ok'}">${aq.current.us_aqi>150?'Unhealthy':aq.current.us_aqi>50?'Moderate':'Good'}</span></div></div>
          <div class="mini"><div class="l">PM2.5</div><div class="v">${fmt(aq.current.pm2_5)} µg/m³</div></div>
          <div class="mini"><div class="l">PM10</div><div class="v">${fmt(aq.current.pm10)} µg/m³</div></div>
        </div>`: `<div style="color:var(--mut);font-size:13px">Air quality data unavailable for this location</div>`}
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="card hourly">
      <h3>🕐 24-Hour Forecast</h3>
      <div class="hour-scroll">
        ${hours.map((h,i)=>`<div class="hour ${i===0?'active':''}"><div class="t">${i===0?'Now':h.t}</div><div class="ic">${(WMAP[h.code]||['','⛅'])[1]}</div><div class="tmp">${fmt(h.temp)}°</div><div style="font-size:10px;color:var(--mut);margin-top:2px">${h.prec}%</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>📅 7-Day Forecast</h3>
      <div class="daily">
        ${daily.time.map((t,i)=>{
          const code=daily.weather_code[i];
          const info=WMAP[code]||['','⛅'];
          const min=daily.temperature_2m_min[i], max=daily.temperature_2m_max[i];
          const range=Math.max(...daily.temperature_2m_max)-Math.min(...daily.temperature_2m_min) || 1;
          const left=((min - Math.min(...daily.temperature_2m_min))/range)*60;
          const width=((max-min)/range)*60+20;
          return `<div class="d-row">
            <div class="d-day">${i===0?'Today':new Date(t).toLocaleDateString('en-IN',{weekday:'short'})}</div>
            <div style="font-size:20px">${info[1]}</div>
            <div style="font-size:12px;color:var(--mut);flex:1">${info[0]}</div>
            <div class="d-bar" style="max-width:110px"><div class="d-bar-fill" style="left:${left}%;width:${width}%"></div></div>
            <div class="d-temp"><span>${fmt(max)}°</span><span class="mn">${fmt(min)}°</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <h3>📊 Weekly Overview</h3>
    <canvas id="weekChart" height="160"></canvas>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--mut)">
      <span>Max Wind: ${fmt(daily.wind_speed_10m_max[0])} km/h</span>
      <span>UV Max: ${fmt(daily.uv_index_max[0])}</span>
      <span>Total Rain: ${daily.precipitation_sum.reduce((a,b)=>a+b,0).toFixed(1)} mm this week</span>
    </div>
  </div>
  `;
  drawTempChart(hours);
  drawWeekChart(daily);
}

function drawTempChart(hours){
 const c=document.getElementById('tempChart'); if(!c)return;
 const ctx=c.getContext('2d');
 const W=c.width=c.offsetWidth*2, H=180; c.height=H;
 const temps=hours.map(h=>h.temp);
 const min=Math.min(...temps)-1, max=Math.max(...temps)+1;
 const pad=20;
 ctx.clearRect(0,0,W,H);
 const step=(W-pad*2)/(temps.length-1);
 // gradient line
 ctx.beginPath();
 temps.forEach((t,i)=>{
   const x=pad+i*step, y=H-30-(t-min)/(max-min)*(H-60);
   if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
 });
 ctx.strokeStyle='#5b8cff'; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.stroke();
 // glow
 ctx.shadowColor='#5b8cff'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0;
 // fill under
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'rgba(91,140,255,.35)'); grad.addColorStop(1,'rgba(91,140,255,0)');
 ctx.lineTo(W-pad,H-20); ctx.lineTo(pad,H-20); ctx.closePath();
 ctx.fillStyle=grad; ctx.fill();
}

function drawWeekChart(daily){
 const c=document.getElementById('weekChart'); if(!c)return;
 const ctx=c.getContext('2d');
 const W=c.width=c.offsetWidth*2, H=320;
 c.height=H;
 const maxs=daily.temperature_2m_max, mins=daily.temperature_2m_min;
 const gMax=Math.max(...maxs)+2, gMin=Math.min(...mins)-2;
 const pad=30, bw=(W-pad*2)/maxs.length;
 ctx.clearRect(0,0,W,H);
 // grid
 ctx.strokeStyle='rgba(255,255,255,.06)';
 for(let i=0;i<=4;i++){const y=20+(H-60)*i/4; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();}
 maxs.forEach((mx,i)=>{
   const mn=mins[i];
   const x=pad+i*bw+bw*.15;
   const yMax=H-40-(mx-gMin)/(gMax-gMin)*(H-70);
   const yMin=H-40-(mn-gMin)/(gMax-gMin)*(H-70);
   const h=yMin-yMax;
   const gr=ctx.createLinearGradient(x,yMax,x,yMin);
   gr.addColorStop(0,'#a855f7'); gr.addColorStop(1,'#5b8cff');
   ctx.fillStyle=gr;
   ctx.beginPath();
   ctx.roundRect(x,yMax,bw*.6,h,10); ctx.fill();
   ctx.fillStyle='#eef2ff'; ctx.font='bold 20px Outfit'; ctx.textAlign='center';
   ctx.fillText(fmt(mx)+'°',x+bw*.3,yMax-8);
   ctx.fillStyle='#8b98b3'; ctx.font='18px Outfit';
   ctx.fillText(fmt(mn)+'°',x+bw*.3,yMin+18);
   ctx.fillStyle='#8b98b3'; ctx.font='18px Outfit';
   const day=new Date(daily.time[i]).toLocaleDateString('en-IN',{weekday:'short'});
   ctx.fillText(day,x+bw*.3,H-12);
 });
}

loadWeather();
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){searchCity(e.target.value);}});
</script>
